[package]
name = "hide-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native GPUI desktop frontend for Hide/lpm"

[dependencies]
gpui = { package = "gpui-ce", version = "0.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
